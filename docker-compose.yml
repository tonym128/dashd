services:
  dashd:
    build: .
    image: ghcr.io/tonym128/dashd:latest
    container_name: dashd-server
    restart: unless-stopped
    ports:
      - "8753:8753"
    environment:
      DASHD_AUTH_TOKEN: "${DASHD_AUTH_TOKEN:-}"
      DASHD_INGEST_TOKEN: "${DASHD_INGEST_TOKEN:-}"
    volumes:
      - dashd-data:/var/lib/dashd
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8753/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - serve
      - -addr
      - 0.0.0.0:8753
      - -models
      - /usr/local/lib/dashd/models.json
      - -models-refresh
      - 24h
      - -db
      - /var/lib/dashd/dashboard.db

volumes:
  dashd-data:
