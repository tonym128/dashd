services:
  dashd:
    build: .
    image: ghcr.io/tonym128/dashd:latest
    container_name: dashd-server
    restart: unless-stopped
    # Published on every interface so push agents can reach it. Docker's port
    # publishing bypasses host firewalls such as ufw, which is why both tokens
    # are required below: compose refuses to start without them.
    ports:
      - "8753:8753"
    environment:
      # Dashboard (read) token for browsers (sign in at /login) and API clients.
      DASHD_AUTH_TOKEN: "${DASHD_AUTH_TOKEN:?set DASHD_AUTH_TOKEN, e.g. export DASHD_AUTH_TOKEN=$(openssl rand -hex 32)}"
      # Write-only token for push agents; give laptops this one, not the dashboard token.
      DASHD_INGEST_TOKEN: "${DASHD_INGEST_TOKEN:?set DASHD_INGEST_TOKEN, e.g. export DASHD_INGEST_TOKEN=$(openssl rand -hex 32)}"
      # Optional: read-only token for LLMs, MCP clients, scripts and external services; cannot ingest or run admin actions.
      DASHD_READ_TOKEN: "${DASHD_READ_TOKEN:-}"
      # Optional: separate token for reprice/prune/rename; without it the dashboard token is admin.
      DASHD_ADMIN_TOKEN: "${DASHD_ADMIN_TOKEN:-}"
      # Timezone used to bucket calls into days.
      DASHD_TZ: "${DASHD_TZ:-UTC}"
    volumes:
      - dashd-data:/var/lib/dashd
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8753/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - serve
      - -addr
      - 0.0.0.0:8753
      - -models
      - /usr/local/lib/dashd/models.json
      - -models-refresh
      - 24h
      - -backup-every
      - 24h
      - -accept-ingest
      - -db
      - /var/lib/dashd/dashboard.db

volumes:
  dashd-data:
